<style>
:root{
  --navy:#06233b;--navy2:#0b3a5a;--blue:#17707d;--sky:#85d1c2;--sun:#fbcf59;--sun2:#e9892f;--coral:#e43c31;
  --cream:#fbfaf4;--ink:#14213d;--muted:#5b6785;--card:#fff;--line:rgba(20,33,61,.1);
  --r:22px;--ease:cubic-bezier(.22,1,.36,1);
  --f-d:'Unbounded','Onest',system-ui,sans-serif;--f-b:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--f-b);color:var(--ink);background:var(--cream);line-height:1.65;font-size:17px;overflow-x:hidden}
a{color:inherit;text-decoration:none}
ul{list-style:none}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--sun2);outline-offset:3px;border-radius:8px}
.skip{position:absolute;left:-999px;top:8px;background:var(--sun);padding:10px 16px;border-radius:10px;z-index:999;font-weight:600}
.skip:focus{left:8px}
.wrap{width:min(1240px,calc(100% - 40px));margin-inline:auto}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* progress + glow */
#progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--sun),var(--coral));z-index:200;transition:width .1s linear}
#glow{position:fixed;width:520px;height:520px;border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(circle,rgba(251,207,89,.16),transparent 62%);transform:translate(-50%,-50%);mix-blend-mode:multiply;opacity:0;transition:opacity .4s}
body.hasglow #glow{opacity:1}

/* top bar */
.topbar{background:var(--navy);color:#cdd8f5;font-size:13.5px}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:40px;flex-wrap:wrap}
.topbar .info{display:flex;gap:22px;flex-wrap:wrap}
.topbar a{display:inline-flex;align-items:center;gap:8px;transition:color .2s}
.topbar a:hover{color:var(--sun)}
.socials{display:flex;gap:6px}
.socials a{width:30px;height:30px;border-radius:50%;justify-content:center;background:rgba(255,255,255,.08);transition:.3s var(--ease)}
.socials a:hover{background:var(--sun);color:var(--navy);transform:translateY(-3px) rotate(-8deg)}

/* header */
header.site{position:sticky;top:0;z-index:100;background:rgba(251,250,244,.82);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid transparent;transition:transform .45s var(--ease),border-color .3s,box-shadow .3s}
header.site.scrolled{border-color:var(--line);box-shadow:0 10px 40px -20px rgba(6,35,59,.35)}
header.site.hide{transform:translateY(-110%)}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:74px}
.logo{display:flex;align-items:center;gap:12px;font-family:var(--f-d);font-weight:800;font-size:20px;letter-spacing:-.02em;line-height:1.05}
.logo small{display:block;font-family:var(--f-b);font-weight:500;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.logo .mark{height:54px;width:auto;flex:none;transition:transform .45s var(--ease);filter:drop-shadow(0 6px 10px rgba(6,35,59,.28))}
.logo:hover .mark{transform:translateY(-3px) rotate(-5deg) scale(1.05)}
nav.main>ul{display:flex;gap:2px;align-items:center}
nav.main>ul>li{position:relative}
nav.main>ul>li>a{display:flex;align-items:center;gap:5px;padding:10px 12px;border-radius:12px;font-weight:600;font-size:14.5px;position:relative;transition:background .25s,color .25s}
nav.main>ul>li>a svg{width:12px;height:12px;transition:transform .3s var(--ease)}
nav.main>ul>li:hover>a,nav.main>ul>li:focus-within>a,nav.main>ul>li>a.on{background:rgba(31,138,153,.08);color:var(--blue)}
nav.main>ul>li:hover>a svg{transform:rotate(180deg)}
.drop{position:absolute;top:calc(100% + 8px);left:0;width:min(680px,92vw);background:#fff;border-radius:20px;padding:16px;box-shadow:0 30px 70px -20px rgba(6,35,59,.45),0 0 0 1px var(--line);opacity:0;visibility:hidden;transform:translateY(14px) scale(.98);transform-origin:top left;transition:.35s var(--ease)}
nav.main>ul>li:nth-last-child(-n+3) .drop{left:auto;right:0;transform-origin:top right}
nav.main>ul>li:hover .drop,nav.main>ul>li:focus-within .drop{opacity:1;visibility:visible;transform:none}
.drop ul.cols{columns:2;column-gap:10px}
.drop.narrow{width:min(420px,92vw)}
.drop.narrow ul.cols{columns:1}
.drop li{break-inside:avoid}
.drop a.l1{display:block;padding:8px 12px;border-radius:10px;font-size:14.5px;font-weight:500;transition:.2s}
.drop a.l1:hover{background:linear-gradient(90deg,rgba(251,207,89,.28),transparent);padding-left:18px;color:var(--navy)}
.drop ul.sub{margin:0 0 6px 12px;padding-left:10px;border-left:2px solid rgba(251,207,89,.7)}
.drop ul.sub a{display:block;padding:4px 10px;font-size:13px;color:var(--muted);border-radius:8px;transition:.2s}
.drop ul.sub a:hover{color:var(--blue);background:rgba(31,138,153,.06)}
.hactions{display:flex;align-items:center;gap:8px}
.ibtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#fff;box-shadow:0 0 0 1px var(--line);transition:.3s var(--ease)}
.ibtn:hover{background:var(--navy);color:#fff;transform:translateY(-2px)}
.burger{display:none}

/* mobile drawer */
#drawer{position:fixed;inset:0;z-index:150;background:var(--navy);color:#fff;padding:22px 22px 60px;overflow-y:auto;transform:translateY(-100%);transition:transform .6s var(--ease);visibility:hidden}
#drawer.open{transform:none;visibility:visible}
#drawer .dtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
#drawer .ibtn{background:rgba(255,255,255,.1);color:#fff;box-shadow:none}
#drawer details{border-bottom:1px solid rgba(255,255,255,.12)}
#drawer summary,#drawer a.top{display:flex;justify-content:space-between;align-items:center;padding:16px 4px;font-family:var(--f-d);font-weight:700;font-size:18px;list-style:none;cursor:pointer}
#drawer summary::-webkit-details-marker{display:none}
#drawer details[open] summary{color:var(--sun)}
#drawer .dl a{display:block;padding:9px 12px;color:#cdd8f5;font-size:15.5px}
#drawer .dl a.s{padding-left:30px;font-size:14px;color:#98a8d6}
#drawer .dl a:hover{color:var(--sun)}

/* search */
#search{position:fixed;inset:0;z-index:180;background:rgba(6,35,59,.55);backdrop-filter:blur(10px);display:grid;place-items:start center;padding-top:12vh;opacity:0;visibility:hidden;transition:.3s}
#search.open{opacity:1;visibility:visible}
.sbox{width:min(640px,calc(100% - 32px));background:#fff;border-radius:24px;box-shadow:0 40px 100px -20px rgba(0,0,0,.6);overflow:hidden;transform:translateY(24px) scale(.97);transition:.45s var(--ease)}
#search.open .sbox{transform:none}
.sbox .row{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.sbox input{flex:1;border:0;outline:0;font:inherit;font-size:18px;background:none}
.sbox kbd{font:inherit;font-size:12px;padding:3px 8px;border-radius:7px;background:#eef1f8;color:var(--muted)}
.sres{max-height:52vh;overflow:auto;padding:8px}
.sres a{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;font-weight:500}
.sres a small{color:var(--muted);font-weight:400}
.sres a:hover,.sres a.f{background:rgba(251,207,89,.28)}
.sres .empty{padding:22px;color:var(--muted);text-align:center}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border-radius:999px;font-weight:700;font-size:16px;transition:transform .35s var(--ease),box-shadow .35s,background .3s;position:relative;will-change:transform}
.btn.sun{background:linear-gradient(135deg,var(--sun),var(--sun2));color:var(--navy);box-shadow:0 14px 34px -10px rgba(233,137,47,.7)}
.btn.sun:hover{box-shadow:0 20px 44px -10px rgba(233,137,47,.9)}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35);backdrop-filter:blur(6px)}
.btn.ghost:hover{background:rgba(255,255,255,.2)}
.btn.dark{background:var(--navy);color:#fff}
.btn.dark:hover{background:var(--blue)}
.btn svg{transition:transform .3s var(--ease)}
.btn:hover svg{transform:translateX(4px)}

/* hero */
.hero{position:relative;min-height:calc(100vh - 114px);min-height:calc(100svh - 114px);display:grid;align-items:center;color:#fff;background:
  radial-gradient(1200px 700px at 85% 10%,rgba(31,138,153,.75),transparent 60%),
  radial-gradient(900px 600px at 0% 100%,rgba(233,137,47,.28),transparent 60%),
  linear-gradient(160deg,#06233b 0%,#0a3350 55%,#06233b 100%);overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1.2px,transparent 1.3px);background-size:34px 34px;mask-image:radial-gradient(ellipse at 60% 40%,#000 10%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 60% 40%,#000 10%,transparent 70%);z-index:-1}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding-block:60px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sun)}
.eyebrow::before{content:"";width:34px;height:2px;background:currentColor;border-radius:2px}
.hero h1{font-family:var(--f-d);font-weight:800;font-size:clamp(46px,8.2vw,112px);line-height:.98;letter-spacing:-.04em;margin:18px 0 22px}
.hero h1 .ln{display:block;overflow:hidden;padding-bottom:.08em}
.hero h1 .ch{display:inline-block;transform:translateY(112%) rotate(6deg);animation:rise .9s var(--ease) forwards;animation-delay:calc(var(--i)*55ms + var(--base,.25s))}
.hero h1 .grad{background:linear-gradient(90deg,var(--sun),var(--sun2),var(--coral));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{font-size:clamp(17px,1.7vw,21px);color:#cdd8f5;max-width:560px}
.hero .cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
.quote{margin-top:40px;padding:20px 24px;border-left:3px solid var(--sun);background:linear-gradient(90deg,rgba(255,255,255,.08),transparent);border-radius:0 18px 18px 0;max-width:560px;font-size:15.5px;color:#dbe4ff}
.quote .w{display:inline-block;opacity:0;transform:translateY(8px);animation:fadeUp .6s var(--ease) forwards;animation-delay:calc(var(--i)*70ms + var(--q,1.3s))}
.quote cite{display:block;margin-top:8px;font-style:normal;font-weight:700;color:var(--sun);font-size:14px}

/* logo stage */
.stage{position:relative;aspect-ratio:1;max-width:560px;margin-inline:auto;width:100%;display:grid;place-items:center;transition:transform .3s ease-out}
.stage .halo{position:absolute;inset:2%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.3),rgba(133,209,194,.16) 42%,transparent 68%);animation:pulse 5s ease-in-out infinite}
.stage .orbit{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.stage .orbit .r1{transform-origin:200px 200px;animation:spin 80s linear infinite}
.stage .orbit .r2{transform-origin:200px 200px;animation:spin 110s linear infinite reverse}
.stage .orbit .r3{transform-origin:200px 200px;animation:spin 36s linear infinite}
.hero-logo{position:relative;width:86%;height:auto;filter:drop-shadow(0 28px 36px rgba(0,0,0,.45)) drop-shadow(0 0 34px rgba(255,255,255,.14));animation:fly 1.6s var(--ease) var(--lg,.2s) both,glide 7s ease-in-out calc(var(--lg,.2s) + 1.7s) infinite}
.plane{position:absolute;left:0;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;z-index:-1;opacity:0;animation:drift var(--t,24s) linear var(--dl,0s) infinite;pointer-events:none}
.trail{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.55;pointer-events:none}
.trail path{fill:none;stroke:rgba(255,255,255,.35);stroke-width:2;stroke-dasharray:2 12;stroke-linecap:round;vector-effect:non-scaling-stroke;animation:dash 40s linear infinite}
.motto{overflow:hidden;background:linear-gradient(90deg,#1f8a99,#e9892f 55%,#e43c31);color:#fff;padding:15px 0;position:relative;z-index:2}
.motto .track{display:flex;gap:34px;align-items:center;width:max-content;animation:marq 34s linear infinite;font-family:var(--f-d);font-weight:700;font-size:clamp(15px,1.7vw,20px);letter-spacing:-.01em;text-transform:uppercase;white-space:nowrap}
.motto svg{width:24px;height:24px;flex:none;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;animation:sway 3s ease-in-out infinite}
#splash{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:radial-gradient(800px 520px at 50% 42%,#0f5069,#06233b);animation:splashOut .7s ease 1.5s forwards}
#splash img{width:min(320px,66vw);animation:fadeIn .9s var(--ease) both;filter:drop-shadow(0 20px 30px rgba(0,0,0,.4))}
#splash .bar{position:absolute;bottom:20%;width:170px;height:3px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
#splash .bar::after{content:"";display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--coral));transform:translateX(-100%);animation:load 1.3s ease .1s forwards}
.phero .plane{color:rgba(255,255,255,.5)}
.chip{position:absolute;display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:18px;background:rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 20px 40px -16px rgba(0,0,0,.5);animation:float 6s ease-in-out infinite;font-size:14px;line-height:1.25}
.chip b{display:block;font-family:var(--f-d);font-size:24px;letter-spacing:-.03em}
.chip.a{top:6%;left:-2%}
.chip.b{bottom:12%;left:-6%;animation-delay:-2s}
.chip.c{top:34%;right:-4%;animation-delay:-4s}
.chip .dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--sun);color:var(--navy)}
.scrollhint{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:26px;height:42px;border-radius:14px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.scrollhint::after{content:"";position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--sun);animation:wheel 1.8s infinite}
.orb{position:absolute;border-radius:50%;filter:blur(60px);z-index:-1;opacity:.6;will-change:transform}
.orb.o1{width:340px;height:340px;background:var(--blue);left:-80px;top:20%}
.orb.o2{width:260px;height:260px;background:var(--sun2);right:10%;bottom:-60px;opacity:.35}

/* sections */
section.sec{padding:110px 0;position:relative}
.sec h2{font-family:var(--f-d);font-weight:800;font-size:clamp(30px,4.4vw,56px);line-height:1.05;letter-spacing:-.035em;margin:14px 0 18px;max-width:900px}
.sec .sub{color:var(--muted);max-width:640px;font-size:18px}
.sec .eyebrow{color:var(--blue)}
.sec.dark{background:var(--navy);color:#fff}
.sec.dark .eyebrow{color:var(--sun)}
.sec.dark .sub{color:#b5c3ee}

/* reveal */
.rv{opacity:0;transform:translateY(34px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
.rv.l{transform:translateX(-40px)}.rv.r{transform:translateX(40px)}.rv.z{transform:scale(.92)}

/* mission */
.mission{display:grid;grid-template-columns:.9fr 1.1fr;gap:60px;align-items:center}
.qcard{position:relative;padding:44px 40px;border-radius:30px;background:linear-gradient(145deg,var(--navy),var(--navy2));color:#fff;overflow:hidden;box-shadow:0 40px 80px -30px rgba(6,35,59,.6)}
.qcard::before{content:"“";position:absolute;right:20px;top:-30px;font-family:Georgia,serif;font-size:260px;line-height:1;color:rgba(251,207,89,.18)}
.qcard p{position:relative;font-family:var(--f-d);font-size:clamp(18px,2vw,24px);line-height:1.4;font-weight:500;letter-spacing:-.02em}
.qcard cite{position:relative;display:block;margin-top:22px;font-style:normal;color:var(--sun);font-weight:700}
.mission .txt p{margin-bottom:16px;color:#2a3558}
.sunline{display:flex;align-items:center;gap:14px;margin-top:26px;padding:20px 24px;border-radius:20px;background:linear-gradient(90deg,rgba(251,207,89,.35),rgba(251,207,89,.08));font-weight:600;font-size:18px}
.sunline svg{width:34px;height:34px;color:var(--sun2);animation:sway 3.2s ease-in-out infinite;flex:none}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:50px}
.stat{padding:30px 26px;border-radius:var(--r);background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);transition:.4s var(--ease);position:relative;overflow:hidden}
.stat:hover{background:rgba(255,255,255,.12);transform:translateY(-6px)}
.stat .n{font-family:var(--f-d);font-weight:800;font-size:clamp(38px,4.6vw,62px);letter-spacing:-.04em;line-height:1;background:linear-gradient(180deg,#fff,var(--sun));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat p{margin-top:10px;color:#b5c3ee;font-size:15px}
.dist{margin-top:34px;display:flex;height:16px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.1)}
.dist i{display:block;height:100%;width:0;transition:width 1.6s var(--ease)}
.dist.in i:nth-child(1){width:37.7%;background:var(--sky)}
.dist.in i:nth-child(2){width:49.2%;background:var(--sun);transition-delay:.2s}
.dist.in i:nth-child(3){width:13.1%;background:var(--coral);transition-delay:.4s}
.legend{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px;color:#b5c3ee;font-size:14px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--c)}

/* profile */
.prof{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:46px}
.pcard{padding:34px 30px;border-radius:var(--r);background:#fff;box-shadow:0 0 0 1px var(--line);position:relative;overflow:hidden;transition:.5s var(--ease)}
.pcard::after{content:"";position:absolute;inset:auto -30% -60% auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(251,207,89,.5),transparent 65%);transition:.6s var(--ease)}
.pcard:hover{transform:translateY(-8px);box-shadow:0 30px 60px -28px rgba(6,35,59,.45)}
.pcard:hover::after{transform:scale(1.5)}
.pcard .tag{display:inline-block;padding:6px 14px;border-radius:99px;background:var(--navy);color:var(--sun);font-family:var(--f-d);font-weight:700;font-size:15px}
.pcard h3{font-family:var(--f-d);font-size:21px;letter-spacing:-.02em;margin:18px 0 8px;line-height:1.2}
.pcard p{color:var(--muted);font-size:15.5px}

/* quick links */
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:46px}
.qlink{--mx:50%;--my:50%;position:relative;display:flex;flex-direction:column;gap:10px;padding:28px 26px 26px;border-radius:var(--r);background:#fff;box-shadow:0 0 0 1px var(--line);overflow:hidden;transform-style:preserve-3d;transition:transform .25s ease-out,box-shadow .4s}
.qlink::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx) var(--my),rgba(251,207,89,.4),transparent 65%);opacity:0;transition:opacity .3s}
.qlink:hover::before{opacity:1}
.qlink:hover{box-shadow:0 30px 60px -28px rgba(6,35,59,.5)}
.qlink .ic{position:relative;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--navy);color:var(--sun);font-size:24px;transition:.4s var(--ease)}
.qlink:hover .ic{background:var(--sun);color:var(--navy);transform:rotate(-8deg) scale(1.08)}
.qlink h3{position:relative;font-family:var(--f-d);font-size:18px;letter-spacing:-.02em;line-height:1.2}
.qlink p{position:relative;color:var(--muted);font-size:14.5px;line-height:1.5}
.qlink .go{position:relative;margin-top:auto;padding-top:8px;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--blue)}
.qlink .go svg{transition:transform .3s var(--ease)}
.qlink:hover .go svg{transform:translateX(6px)}

/* news */
.nhead{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}
.ngrid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px;margin-top:44px}
.ncard{grid-column:span 4;position:relative;display:flex;flex-direction:column;gap:12px;padding:28px;border-radius:var(--r);background:#fff;box-shadow:0 0 0 1px var(--line);transition:.5s var(--ease);overflow:hidden}
.ncard.big{grid-column:span 8;background:linear-gradient(140deg,var(--navy),var(--navy2));color:#fff}
.ncard::before{content:"";position:absolute;left:0;top:0;height:4px;width:0;background:linear-gradient(90deg,var(--sun),var(--coral));transition:width .6s var(--ease)}
.ncard:hover{transform:translateY(-8px);box-shadow:0 34px 60px -30px rgba(6,35,59,.5)}
.ncard:hover::before{width:100%}
.ncard .date{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--blue)}
.ncard.big .date{color:var(--sun)}
.ncard h3{font-family:var(--f-d);font-size:19px;line-height:1.25;letter-spacing:-.02em}
.ncard.big h3{font-size:clamp(22px,2.6vw,32px)}
.ncard p{color:var(--muted);font-size:15.5px}
.ncard.big p{color:#b5c3ee}
.ncard .more{margin-top:auto;display:inline-flex;gap:8px;align-items:center;font-weight:700;font-size:14.5px;color:var(--blue)}
.ncard.big .more{color:var(--sun)}
.ncard .more svg{transition:transform .3s var(--ease)}
.ncard:hover .more svg{transform:translate(4px,-4px)}
.badge{align-self:flex-start;padding:5px 12px;border-radius:99px;background:rgba(251,207,89,.35);font-size:12.5px;font-weight:700;color:var(--navy)}
.ncard.big .badge{background:var(--sun)}

/* calendar + notice */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.cal{padding:28px;border-radius:26px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.cal .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.cal h4{font-family:var(--f-d);font-size:18px;letter-spacing:-.02em}
.cal .nv{display:flex;gap:6px}
.cal .nv button{width:36px;height:36px;border-radius:12px;background:#eef1f8;display:grid;place-items:center;transition:.25s}
.cal .nv button:hover{background:var(--sun)}
.cal table{width:100%;border-collapse:separate;border-spacing:4px;text-align:center}
.cal th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;padding-bottom:4px}
.cal td{height:42px;border-radius:12px;font-weight:500;font-size:15px;transition:.2s}
.cal td.d:hover{background:rgba(31,138,153,.1)}
.cal td.today{background:linear-gradient(135deg,var(--sun),var(--sun2));font-weight:800;color:var(--navy);box-shadow:0 8px 20px -8px rgba(233,137,47,.9)}
.cal td.we{color:var(--coral)}
.notice{padding:38px;border-radius:26px;background:linear-gradient(150deg,#1f8a99,#0a3350);color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px;justify-content:center}
.notice::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(251,207,89,.6),transparent 65%)}
.notice h3{font-family:var(--f-d);font-size:clamp(22px,2.4vw,30px);line-height:1.2;letter-spacing:-.025em;position:relative}
.notice p{color:#cfe0ff;position:relative}
.notice .btn{align-self:flex-start;position:relative}

/* marquee */
.marq{overflow:hidden;padding:26px 0;border-block:1px solid var(--line);background:#fff;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marq .track{display:flex;gap:16px;width:max-content;animation:marq 38s linear infinite}
.marq:hover .track{animation-play-state:paused}
.marq a{display:flex;align-items:center;gap:12px;padding:14px 26px;border-radius:99px;background:var(--cream);box-shadow:inset 0 0 0 1px var(--line);font-weight:600;white-space:nowrap;transition:.3s}
.marq a:hover{background:var(--navy);color:var(--sun)}
.marq a i{width:10px;height:10px;border-radius:50%;background:var(--sun2)}

/* contacts block */
.cgrid{display:grid;grid-template-columns:.9fr 1.1fr;gap:26px;margin-top:44px}
.clist{display:grid;gap:14px}
.citem{display:flex;gap:16px;align-items:center;padding:20px 22px;border-radius:20px;background:#fff;box-shadow:0 0 0 1px var(--line);transition:.4s var(--ease)}
.citem:hover{transform:translateX(8px);box-shadow:0 20px 40px -24px rgba(6,35,59,.5)}
.citem .ic{width:48px;height:48px;border-radius:14px;background:var(--navy);color:var(--sun);display:grid;place-items:center;font-size:22px;flex:none}
.citem small{display:block;color:var(--muted);font-size:13px}
.citem b{font-weight:600}
.map{border-radius:26px;overflow:hidden;box-shadow:0 0 0 1px var(--line);min-height:380px;background:#e7ecf7}
.map iframe{width:100%;height:100%;min-height:380px;border:0;filter:saturate(1.1)}

/* footer */
footer.site{background:var(--navy);color:#b5c3ee;padding:80px 0 30px;position:relative;overflow:hidden}
footer.site::before{content:"";position:absolute;left:50%;top:-220px;width:700px;height:420px;margin-left:-350px;border-radius:50%;background:radial-gradient(circle,rgba(251,207,89,.18),transparent 65%)}
.fgrid{position:relative;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px}
footer h5{font-family:var(--f-d);color:#fff;font-size:15px;margin-bottom:16px;letter-spacing:-.01em}
footer li{margin-bottom:9px;font-size:15px}
footer a{transition:.2s}
footer a:hover{color:var(--sun)}
footer .logo{color:#fff;margin-bottom:16px}
footer .logo small{color:#8d9dcf}
.fbot{position:relative;margin-top:56px;padding-top:24px;border-top:1px solid rgba(255,255,255,.12);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13.5px}

/* inner pages */
.phero{position:relative;color:#fff;padding:70px 0 80px;background:radial-gradient(800px 400px at 90% 0%,rgba(31,138,153,.8),transparent 60%),linear-gradient(160deg,#06233b,#0a3350);overflow:hidden;isolation:isolate}
.phero::after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(251,207,89,.45),transparent 65%);z-index:-1;animation:pulse 6s ease-in-out infinite}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:#9fb0e3;margin-bottom:20px}
.crumbs a:hover{color:var(--sun)}
.crumbs span.sep{opacity:.5}
.phero h1{font-family:var(--f-d);font-weight:800;font-size:clamp(30px,5vw,60px);line-height:1.05;letter-spacing:-.035em;max-width:900px}
.phero h1 .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.1em}
.phero h1 .w span{display:inline-block;transform:translateY(110%);animation:rise .9s var(--ease) forwards;animation-delay:calc(var(--i)*70ms + var(--pb,.1s))}
.phero p.lead{margin-top:16px;color:#cdd8f5;max-width:640px;font-size:18px}
.layout{display:grid;grid-template-columns:1fr 340px;gap:34px;padding:60px 0 100px;align-items:start}
.layout.full{grid-template-columns:1fr}
.aside{display:grid;gap:22px;position:sticky;top:96px}
.panel{padding:26px;border-radius:24px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.panel h4{font-family:var(--f-d);font-size:16px;margin-bottom:12px;letter-spacing:-.01em}
.snav a{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:12px;font-size:14.5px;transition:.2s}
.snav a:hover,.snav a.on{background:rgba(251,207,89,.3);padding-left:18px}
.snav a.on{font-weight:700}
.prose{padding:40px;border-radius:26px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.prose h2{font-family:var(--f-d);font-size:26px;letter-spacing:-.025em;margin:0 0 14px;line-height:1.2}
.prose h3{font-family:var(--f-d);font-size:19px;margin:26px 0 8px}
.prose p{margin-bottom:14px;color:#2a3558}
.notebox{display:flex;gap:16px;align-items:flex-start;padding:22px 24px;border-radius:20px;background:rgba(251,207,89,.22);margin-top:24px}
.notebox svg{width:28px;height:28px;color:var(--sun2);margin-top:2px}
.hubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.hubcard{position:relative;display:flex;flex-direction:column;gap:8px;padding:24px;border-radius:20px;background:#fff;box-shadow:0 0 0 1px var(--line);transition:.45s var(--ease);overflow:hidden}
.hubcard:hover{transform:translateY(-6px);box-shadow:0 26px 50px -28px rgba(6,35,59,.5)}
.hubcard::before{content:attr(data-n);position:absolute;right:14px;top:4px;font-family:var(--f-d);font-weight:800;font-size:64px;color:rgba(251,207,89,.28);line-height:1;transition:.5s var(--ease)}
.hubcard:hover::before{transform:scale(1.2) rotate(-6deg);color:rgba(251,207,89,.5)}
.hubcard h3{position:relative;font-family:var(--f-d);font-size:16.5px;line-height:1.25;letter-spacing:-.015em;max-width:85%}
.hubcard ul{position:relative;margin-top:4px}
.hubcard li{font-size:13.5px;color:var(--muted);padding:2px 0 2px 14px;position:relative}
.hubcard li::before{content:"";position:absolute;left:0;top:11px;width:6px;height:6px;border-radius:50%;background:var(--sun2)}
.hubcard .go{position:relative;margin-top:auto;padding-top:8px;display:inline-flex;gap:8px;align-items:center;font-weight:700;font-size:14px;color:var(--blue)}
/* people */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.person{display:flex;gap:16px;align-items:center;padding:20px;border-radius:20px;background:#fff;box-shadow:0 0 0 1px var(--line);transition:.45s var(--ease)}
.person:hover{transform:translateY(-6px);box-shadow:0 26px 50px -28px rgba(6,35,59,.5)}
.av{width:62px;height:62px;border-radius:20px;flex:none;display:grid;place-items:center;font-family:var(--f-d);font-weight:800;font-size:20px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));transition:.5s var(--ease)}
.person:hover .av{border-radius:50%;transform:rotate(-8deg)}
.person small{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-bottom:3px}
.person b{font-weight:700;line-height:1.3}
.person.dir{grid-column:1/-1;padding:34px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff}
.person.dir small{color:var(--sun);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.person.dir b{font-family:var(--f-d);font-size:clamp(22px,3vw,34px);letter-spacing:-.025em}
.person.dir .av{width:96px;height:96px;font-size:32px;background:linear-gradient(135deg,var(--sun),var(--sun2));color:var(--navy);border-radius:30px}
.grp{font-family:var(--f-d);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin:34px 0 14px;display:flex;align-items:center;gap:12px}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.grp:first-child{margin-top:0}
/* filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:26px}
.fchip{padding:9px 18px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);font-weight:600;font-size:14.5px;transition:.25s}
.fchip:hover{background:rgba(251,207,89,.3)}
.fchip.on{background:var(--navy);color:var(--sun)}
.filters input{flex:1;min-width:200px;padding:11px 18px;border-radius:99px;border:0;box-shadow:inset 0 0 0 1px var(--line);font:inherit;font-size:15px;background:#fff;outline:0}
.filters input:focus{box-shadow:inset 0 0 0 2px var(--sun2)}
.nlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.nlist .ncard{grid-column:auto}
.nlist .ncard.hide{display:none}
/* contact page */
.form{display:grid;gap:14px;margin-top:10px}
.form label{display:grid;gap:6px;font-weight:600;font-size:14.5px}
.form input,.form textarea{padding:14px 16px;border-radius:14px;border:0;box-shadow:inset 0 0 0 1px var(--line);font:inherit;background:#fff;outline:0;transition:.2s}
.form input:focus,.form textarea:focus{box-shadow:inset 0 0 0 2px var(--sun2)}
.req{display:grid;gap:10px;margin-top:14px}
.req div{display:flex;justify-content:space-between;gap:14px;padding:12px 16px;border-radius:14px;background:var(--cream);font-size:15px;flex-wrap:wrap}
.req b{font-weight:700}
.copy{padding:6px 14px;border-radius:99px;background:var(--navy);color:var(--sun);font-size:13px;font-weight:700}
.club-img{border-radius:20px;overflow:hidden;box-shadow:0 0 0 1px var(--line);margin-top:20px}

.pagein{animation:pagein .8s var(--ease) both}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{to{transform:none}}
@keyframes fadeUp{to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.85}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes wheel{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(16px)}}
@keyframes marq{to{transform:translateX(-50%)}}
@keyframes fly{from{transform:translate(-55%,48%) rotate(-26deg) scale(.45);opacity:0}60%{opacity:1}to{transform:none;opacity:1}}
@keyframes glide{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(-1.8deg)}}
@keyframes drift{0%{transform:translate(-8vw,14vh) rotate(-16deg);opacity:0}8%{opacity:.9}92%{opacity:.9}100%{transform:translate(112vw,-34vh) rotate(-16deg);opacity:0}}
@keyframes dash{to{stroke-dashoffset:-700}}
@keyframes sway{0%,100%{transform:rotate(-10deg) translateY(0)}50%{transform:rotate(8deg) translateY(-3px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(18px) scale(.9)}to{opacity:1;transform:none}}
@keyframes load{to{transform:none}}
@keyframes splashOut{to{opacity:0;visibility:hidden;pointer-events:none}}
@keyframes pagein{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

@media (max-width:1100px){
  nav.main{display:none}.burger{display:grid}
  .hero .wrap{grid-template-columns:1fr}
  .stage{max-width:420px;order:-1}
  .hero{min-height:auto}
  .qgrid{grid-template-columns:repeat(2,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .fgrid{grid-template-columns:1fr 1fr}
  .layout{grid-template-columns:1fr}.aside{position:static}
}
@media (max-width:820px){
  body{font-size:16px}
  section.sec{padding:76px 0}
  .mission,.prof,.duo,.cgrid{grid-template-columns:1fr}
  .ngrid{grid-template-columns:1fr}.ncard,.ncard.big{grid-column:auto}
  .topbar .info a:nth-child(3){display:none}
  .chip{display:none}
  .prose{padding:26px}
}
@media (max-width:520px){
  .qgrid{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr;gap:12px}.stat{padding:22px 18px}
  .topbar .info a:nth-child(2){display:none}
}
@media (prefers-reduced-motion:reduce){
  #splash,.plane,.trail{display:none!important}
  .hero-logo{animation:none}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .rv{opacity:1;transform:none}.hero h1 .ch,.phero h1 .w span{transform:none}.quote .w{opacity:1;transform:none}
}
</style>
</head>

function route(){
  const rs=document.documentElement.style;
  [['--base','1.7s'],['--q','2.6s'],['--lg','1.5s'],['--pb','1.6s']].forEach(([k,v])=>firstLoad?rs.setProperty(k,v):rs.removeProperty(k));firstLoad=false;

  const n=NODES[h];let html,title='Школа №92 · Львів';

  else if(R[h])html=R[h](),title=n.t+' · Школа №92';
  else if(n)html=(n.kids.length?hub(n):leaf(n)),title=n.t+' · Школа №92';
  else html=pageShell(null,'Сторінку не знайдено','',`<div class="prose"><p>Такої сторінки немає. <a href="#/" style="color:var(--blue);font-weight:700">Повернутися на головну →</a></p></div>`,false);

}
window.addEventListener('hashchange',route);

/* ───────── FX ───────── */
let io,cio;
function initFx(){
  io&&io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12,rootMargin:'0px 0px -6% 0px'});
  app.querySelectorAll('.rv:not(.in)').forEach(el=>io.observe(el));
  const dist=document.getElementById('dist');if(dist)io.observe(dist);
  cio=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;cio.unobserve(e.target);
    const to=+e.target.dataset.to,t0=performance.now(),dur=1800;
    const f=t=>{const p=Math.min(1,(t-t0)/dur),v=1-Math.pow(1-p,4);e.target.textContent=Math.round(to*v).toLocaleString('uk-UA');if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}),{threshold:.6});
  app.querySelectorAll('.count').forEach(c=>cio.observe(c));
  /* tilt + spotlight */
  if(matchMedia('(pointer:fine)').matches&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
    app.querySelectorAll('.tilt').forEach(el=>{
      el.addEventListener('mousemove',e=>{const r=el.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
        el.style.setProperty('--mx',x+'px');el.style.setProperty('--my',y+'px');
        el.style.transform=`perspective(900px) rotateX(${((y/r.height)-.5)*-7}deg) rotateY(${((x/r.width)-.5)*7}deg) translateY(-6px)`});
      el.addEventListener('mouseleave',()=>{el.style.transform=''});});
    app.querySelectorAll('.mag').forEach(el=>{
      el.addEventListener('mousemove',e=>{const r=el.getBoundingClientRect();el.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.18}px,${(e.clientY-r.top-r.height/2)*.28}px)`});
      el.addEventListener('mouseleave',()=>{el.style.transform=''});});
  }
  /* news filters */
  const nl=document.getElementById('nlist');
  if(nl){let y='',q='';const ap=()=>nl.querySelectorAll('.ncard').forEach(c=>c.classList.toggle('hide',!((!y||c.dataset.y===y)&&(!q||c.dataset.t.includes(q)))));
    app.querySelectorAll('.fchip').forEach(b=>b.onclick=()=>{app.querySelectorAll('.fchip').forEach(x=>x.classList.remove('on'));b.classList.add('on');y=b.dataset.y;ap()});
    document.getElementById('nq').oninput=e=>{q=e.target.value.trim().toLowerCase();ap()}}
  /* contact form */
  const cf=document.getElementById('cform');
  if(cf)cf.onsubmit=e=>{e.preventDefault();const d=new FormData(cf);location.href=`mailto:shkola92@ukr.net?subject=${encodeURIComponent(d.get('s'))}&body=${encodeURIComponent(d.get('m')+'\n\n— '+d.get('n'))}`};
  /* copy */
  app.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(b.dataset.copy).then(()=>{b.textContent='Скопійовано ✓';setTimeout(()=>b.textContent='Копіювати',1800)})});
}
/* calendar nav (delegated) */
document.addEventListener('click',e=>{

  const c=b.closest('.cal');let y=+c.dataset.y,m=+c.dataset.m+ +b.dataset.dir;
  if(m<0){m=11;y--}if(m>11){m=0;y++}

});
/* scroll: progress, header, parallax */
const hdr=document.getElementById('hdr'),prog=document.getElementById('progress');let lastY=0,tick=false;
addEventListener('scroll',()=>{if(tick)return;tick=true;requestAnimationFrame(()=>{
  const y=scrollY,h=document.documentElement.scrollHeight-innerHeight;
  prog.style.width=(h>0?y/h*100:0)+'%';hdr.classList.toggle('scrolled',y>20);hdr.classList.toggle('hide',y>lastY&&y>320);lastY=y;
  document.querySelectorAll('.orb').forEach(o=>o.style.transform=`translateY(${y*(+o.dataset.p||0)/100}px)`);
  tick=false})},{passive:true});
/* cursor glow + hero parallax */
if(matchMedia('(pointer:fine)').matches&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
  document.body.classList.add('hasglow');const g=document.getElementById('glow');let gx=0,gy=0,tx=0,ty=0;
  addEventListener('mousemove',e=>{tx=e.clientX;ty=e.clientY;
    const sb=document.querySelector('.stage');if(sb){const x=(e.clientX/innerWidth-.5),y=(e.clientY/innerHeight-.5);sb.style.transform=`translate(${x*-24}px,${y*-24}px)`}});
  (function l(){gx+=(tx-gx)*.12;gy+=(ty-gy)*.12;g.style.left=gx+'px';g.style.top=gy+'px';requestAnimationFrame(l)})();
}
/* drawer */
const dr=document.getElementById('drawer');
function openDrawer(){dr.classList.add('open');dr.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function closeDrawer(){dr.classList.remove('open');dr.setAttribute('aria-hidden','true');document.body.style.overflow=''}
document.getElementById('bbtn').onclick=openDrawer;
dr.addEventListener('click',e=>{if(e.target.closest('#dclose')||e.target.closest('a'))closeDrawer()});
/* search */
const se=document.getElementById('search'),sin=document.getElementById('sin'),sres=document.getElementById('sres');
function openSearch(){se.classList.add('open');sin.value='';doSearch('');setTimeout(()=>sin.focus(),50)}
function closeSearch(){se.classList.remove('open')}
function doSearch(q){q=q.trim().toLowerCase();
  const r=(q?FLAT.filter(n=>n.t.toLowerCase().includes(q)):FLAT.filter(n=>!n.parent)).slice(0,30);
  sres.innerHTML=r.length?r.map(n=>`<a href="#/${n.s}"><span>${n.t}</span><small>${n.parent?rootOf(n).t:'Розділ'}</small></a>`).join(''):'<div class="empty">Нічого не знайдено</div>'}
document.getElementById('sbtn').onclick=openSearch;
sin.oninput=e=>doSearch(e.target.value);
se.addEventListener('click',e=>{if(e.target===se||e.target.closest('a'))closeSearch()});
sin.addEventListener('keydown',e=>{if(e.key==='Enter'){const a=sres.querySelector('a');if(a)a.click()}});
addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}

});
